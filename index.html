<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // aplica el tema antes de pintar para evitar parpadeo
      try {
        var t = localStorage.getItem('theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
    <meta name="description" content="Aprende criptografía clásica haciendo: lecciones interactivas de César, Playfair, Hill, permutación y más." />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Criptografía Online</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Criptografía Online necesita JavaScript para ejecutar los laboratorios interactivos.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
